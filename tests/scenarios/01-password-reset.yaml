# Proves a standard caller who answers two security questions gets a password reset: the temporary password goes to
# the outbox by email and SMS to the user, must_change_password is set, the seed lockout is cleared, and the password
# appears in no reply and in nothing sent to the model (the runner's safety invariants check that after every step).
user: lbianchi
local: true
steps:
  - caller: Hi, I forgot my password and now I'm locked out of my laptop.
    model:
      - say: I can help with that. What is your username or work email?
    expect:
      events: [prerouter start_pipeline password_reset]
      offered: [[lookup_account, escalate, end_call]]
      session: { pipeline: password_reset, state: collect_identifier, verified: false }

  - caller: It's {{email}}.
    model:
      - tool: { name: lookup_account, args: { identifier: '{{email}}' } }
      - tool: { name: get_next_security_question }
      - say: Thanks. Here is your first security question.
    expect:
      events: [lookup_account found, get_next_security_question asked]
      offered: [[lookup_account, escalate, end_call], [get_next_security_question], []]

  - caller: '{{answer}}'
    model:
      - tool: { name: verify_security_answer, args: { answer: '{{answer}}' } }
      - tool: { name: get_next_security_question }
      - say: That's right. Here is the next one.
    expect:
      events: [verify_security_answer pass, get_next_security_question asked]
      offered: [[verify_security_answer], [get_next_security_question], []]
      session: { verified: false }

  - caller: '{{answer}}'
    model:
      - tool: { name: verify_security_answer, args: { answer: '{{answer}}' } }
      - tool: { name: reset_password }
      - say: >-
          You're all set. A temporary password went to your email and your mobile phone, and you'll change it at your
          next sign-in. Your account is unlocked too, so is there anything else?
    expect:
      events: [verify_security_answer complete, reset_password done]
      offered: [[verify_security_answer], [reset_password], [start_pipeline, create_ticket, escalate, end_call]]
      session: { pipeline: password_reset, state: done, status: active, verified: true }
      user: { must_change_password: true, is_locked: false, locked_until: null }
      outbox: [email la***, sms ***-***-9331]
      audit: { present: [password_reset account_unlocked=true] }
